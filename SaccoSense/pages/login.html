
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SaccoSense</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="login-container">

        <!-- LEFT SECTION: BRAND NAME -->

        <section class="brand-section">
            <a href="../index.html" class="website-name">SaccoSense</a>
        </section>


        <!-- RIGHT SECTION: LOGIN FORM -->

        <section class="login-section">

            <div class="login-content">

                <div class="login-heading">
                    <h1>Welcome Back</h1>
                    <p>Sign in to access your account.</p>
                </div>


                <form id="loginForm">

    <!-- added by claude-->                
                    <!-- ROLE SELECTOR -->

                    <fieldset class="role-selector">
                        <legend>I am signing in as</legend>

                        <div class="role-options">
                            <label class="role-option">
                                <input type="radio" name="role" value="admin" checked>
                                <span>Administrator</span>
                            </label>

                            <label class="role-option">
                                <input type="radio" name="role" value="member">
                                <span>Member</span>
                            </label>
                        </div>
                    </fieldset>
<!-- io hapo juu    -->

                    <!-- EMAIL FIELD -->

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >
                    </div>


                    <!-- PASSWORD FIELD -->

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-container">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                            >
                                Show
                            </button>
                        </div>
                    </div>


                    <!-- REMEMBER ME AND FORGOT PASSWORD -->

                    <div class="login-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            Remember me
                        </label>

                        <a href="#" class="forgot-password">
                            Forgot password?
                        </a>
                    </div>


                    <!-- LOGIN BUTTON -->

                    <button type="submit" class="login-button">
                        Sign In
                    </button>

                    <p id="loginMessage" class="login-message"></p>
                </form>
            </div>
        </section>
    </main>


    <!-- data.js lets the login check that a member's email exists -->
    <script src="../js/data.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
