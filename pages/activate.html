<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Account | SaccoSense</title>
    <!-- same look as the login page -->
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="login-container">

        <!-- LEFT SECTION: BRAND NAME -->

        <section class="brand-section">
            <a href="../index.html" class="website-name">SaccoSense</a>
        </section>


        <!-- RIGHT SECTION: ACTIVATION FORM -->

        <section class="login-section">

            <div class="login-content">

                <div class="login-heading">
                    <h1>Activate Your Account</h1>
                    <p>Use the email address you gave your SACCO and choose a password.</p>
                </div>


                <form id="activateForm">

                    <!-- EMAIL FIELD -->

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            required
                        >
                    </div>


                    <!-- PASSWORD FIELD -->

                    <div class="form-group">
                        <label for="password">Choose a Password</label>
                        <div class="password-container">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="At least 8 characters"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                            >
                                Show
                            </button>
                        </div>
                    </div>


                    <!-- CONFIRM PASSWORD FIELD -->

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Type the password again"
                            required
                        >
                    </div>


                    <!-- ACTIVATE BUTTON -->

                    <button type="submit" id="activateButton" class="login-button">
                        Activate Account
                    </button>

                    <p id="activateMessage" class="login-message"></p>

                    <p class="switch-page-link">
                        Already activated? <a href="login.html">Sign in</a>
                    </p>
                </form>
            </div>
        </section>
    </main>


    <!-- Supabase library -> connection settings -> data layer -> this page -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/activate.js"></script>
</body>
</html>
