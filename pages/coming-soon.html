<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | SaccoSense</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body>

    <!-- One shared placeholder for every page that isn't built yet.
         Usage: coming-soon.html?page=Members -->

    <main class="coming-soon">
        <a href="../index.html" class="website-name">SaccoSense</a>

        <span class="coming-soon-icon"><i class="fa-solid fa-person-digging" aria-hidden="true"></i></span>

        <h1><span id="pageName">This page</span> is coming soon</h1>
        <p>We're still building this part of SaccoSense. Check back soon. In the meantime, you can return to where you were.</p>

        <div class="coming-soon-actions">
            <button type="button" class="btn btn-secondary" id="goBack">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Go back
            </button>
            <a href="login.html" class="btn btn-primary" id="homeLink">Back to sign in</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/data.js"></script>
    <script>
        // wait until data.js knows who is logged in
        SaccoData.ready.then(function () {
            // show the page name from the link, e.g. ?page=Members
            const name = new URLSearchParams(window.location.search).get("page");
            if (name) {
                document.getElementById("pageName").textContent = name;
                document.title = name + " – Coming Soon | SaccoSense";
            }

            // logged-in users get a shortcut back to their own dashboard
            const user = SaccoData.getCurrentUser();
            const homeLink = document.getElementById("homeLink");
            if (user && (user.role === "admin" || user.role === "member")) {
                homeLink.href = user.role + "/dashboard.html";
                homeLink.textContent = "Go to dashboard";
            }

            document.getElementById("goBack").addEventListener("click", function () {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = homeLink.href;
                }
            });
        });
    </script>
</body>
</html>
